<!DOCTYPE html>
<html>
<head>
  <title>MLBB Top-Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .package-card {
      cursor: pointer;
      transition: 0.3s;
    }
    .package-card.selected {
      border: 2px solid #ffc107;
      background-color: #fff3cd;
    }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">MLBB Top-Up</a>
  </div>
</nav>

<div class="container mt-4">
  <!-- Step 1: MLBB ID -->
  <div class="card p-4 mb-4">
    <h4>Enter MLBB Account</h4>
    <input id="mlbbId" class="form-control mb-2" placeholder="Game ID">
    <input id="mlbbServer" class="form-control mb-2" placeholder="Server ID">
  </div>

  <!-- Step 2: Diamond Packages -->
  <div class="card p-4 mb-4">
    <h4>Select Diamonds</h4>
    <div class="row">
      <div class="col-md-3 mb-3">
        <div class="card text-center p-3 package-card" onclick="selectPackage(this,50,50)">
          <h5>50 Diamonds</h5>
          <p>₱50</p>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card text-center p-3 package-card" onclick="selectPackage(this,100,100)">
          <h5>100 Diamonds</h5>
          <p>₱100</p>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card text-center p-3 package-card" onclick="selectPackage(this,250,250)">
          <h5>250 Diamonds</h5>
          <p>₱250</p>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card text-center p-3 package-card" onclick="selectPackage(this,500,500)">
          <h5>500 Diamonds</h5>
          <p>₱500</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Step 3: Payment -->
  <div class="card p-4 mb-4">
    <h4>Select Payment Method</h4>
    <select id="paymentMethod" class="form-select">
      <option value="GCash">GCash</option>
      <option value="PayMaya">PayMaya</option>
      <option value="PayPal">PayPal</option>
    </select>
  </div>

  <!-- Step 4: Pay Now -->
  <div class="card p-4 mb-4">
    <h4>Checkout</h4>
    <button class="btn btn-success w-100" onclick="checkout()">Pay Now</button>
    <p id="statusMsg" class="mt-3 text-center fw-bold"></p>
  </div>
</div>

<!-- Step 5: Transaction History -->
  <div class="card p-4 mb-4">
    <h4>Transaction History</h4>
    <table class="table table-striped">
      <thead>
        <tr><th>ID</th><th>Diamonds</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr>
      </thead>
      <tbody id="history"></tbody>
    </table>
  </div>
</div>
  <form id="topupForm">
    <input type="text" id="mlbbId" placeholder="MLBB ID" required>
    <input type="text" id="mlbbServer" placeholder="Server" required>
    <input type="number" id="diamonds" placeholder="Diamonds" required>
    <input type="number" id="amount" placeholder="Amount" required>
    <input type="text" id="method" placeholder="Payment Method" required>
    <button type="submit">Top Up</button>
  </form>

  <div id="history"></div>

  <script>
    // --- Functions ---
    async function login(email, password) {
      const response = await fetch('https://topupwebproject-production.up.railway.app/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await response.json();
      if (data.token) {
        localStorage.setItem('token', data.token);
        return data;
      }
    }

    async function createTopUp(diamonds, amount, method, mlbbId, mlbbServer) {
      const token = localStorage.getItem('token');
      const response = await fetch('https://topupwebproject-production.up.railway.app/topup', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': token
        },
        body: JSON.stringify({ diamonds, amount, method, mlbbId, mlbbServer })
      });
      return await response.json();
    }

    async function getHistory() {
      const token = localStorage.getItem('token');
      const response = await fetch('https://topupwebproject-production.up.railway.app/history', {
        method: 'GET',
        headers: { 'Authorization': token }
      });
      return await response.json();
    }

    async function checkHealth() {
      const response = await fetch('https://topupwebproject-production.up.railway.app/health');
      return await response.json();
    }

    // --- Top-up form handler ---
    document.getElementById('topupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mlbbId = document.getElementById('mlbbId').value;
      const mlbbServer = document.getElementById('mlbbServer').value;
      const diamonds = document.getElementById('diamonds').value;
      const amount = document.getElementById('amount').value;
      const method = document.getElementById('method').value;

      const result = await createTopUp(diamonds, amount, method, mlbbId, mlbbServer);
      alert('Top-up result: ' + JSON.stringify(result));

      // Refresh history
      const history = await getHistory();
      document.getElementById('history').innerText = JSON.stringify(history, null, 2);
    });
  </script>

 
</body>
</html>
