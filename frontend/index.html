<!DOCTYPE html>
<html>
<head>
  <title>MLBB Top-Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .package-card {
      cursor: pointer;
      transition: 0.3s;
    }
    .package-card.selected {
      border: 2px solid #ffc107;
      background-color: #fff3cd;
    }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">MLBB Top-Up</a>
  </div>
</nav>

<div class="container mt-4">
  <!-- Step 1: MLBB ID -->
  <div class="card p-4 mb-4">
    <h4>Enter MLBB Account</h4>
    <input id="mlbbId" class="form-control mb-2" placeholder="Game ID">
    <input id="mlbbServer" class="form-control mb-2" placeholder="Server ID">
  </div>

  <!-- Step 2: Diamond Packages -->
  <div class="card p-4 mb-4">
    <h4>Select Diamonds</h4>
    <div class="row">
      <div class="col-md-3 mb-3">
        <div class="card text-center p-3 package-card" onclick="selectPackage(this,50,50)">
          <h5>50 Diamonds</h5>
          <p>₱50</p>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card text-center p-3 package-card" onclick="selectPackage(this,100,100)">
          <h5>100 Diamonds</h5>
          <p>₱100</p>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card text-center p-3 package-card" onclick="selectPackage(this,250,250)">
          <h5>250 Diamonds</h5>
          <p>₱250</p>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card text-center p-3 package-card" onclick="selectPackage(this,500,500)">
          <h5>500 Diamonds</h5>
          <p>₱500</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Step 3: Payment -->
  <div class="card p-4 mb-4">
    <h4>Select Payment Method</h4>
    <select id="paymentMethod" class="form-select">
      <option value="GCash">GCash</option>
      <option value="PayMaya">PayMaya</option>
      <option value="PayPal">PayPal</option>
    </select>
  </div>

  <!-- Step 4: Pay Now -->
  <div class="card p-4 mb-4">
    <h4>Checkout</h4>
    <button class="btn btn-success w-100" onclick="checkout()">Pay Now</button>
    <p id="statusMsg" class="mt-3 text-center fw-bold"></p>
  </div>
</div>

<!-- Step 5: Transaction History -->
  <div class="card p-4 mb-4">
    <h4>Transaction History</h4>
    <table class="table table-striped">
      <thead>
        <tr><th>ID</th><th>Diamonds</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr>
      </thead>
      <tbody id="history"></tbody>
    </table>
  </div>
</div>

<script>
  let selectedDiamonds = 0;
  let selectedAmount = 0;
  let transactionCounter = 1; // simple counter for demo

  function selectPackage(element, diamonds, amount) {
    document.querySelectorAll('.package-card').forEach(card => card.classList.remove('selected'));
    element.classList.add('selected');
    selectedDiamonds = diamonds;
    selectedAmount = amount;
  }

  async function checkout() {
    if (!selectedDiamonds) {
      alert("Please select a diamond package!");
      return;
    }
    const mlbbId = document.getElementById("mlbbId").value;
    const mlbbServer = document.getElementById("mlbbServer").value;
    const method = document.getElementById("paymentMethod").value;

    // Show success instantly
    document.getElementById("statusMsg").innerText = 
      `✅ Payment Successful! ${selectedDiamonds} Diamonds purchased for ₱${selectedAmount} via ${method}.`;

    // Add to transaction history table
    const historyTable = document.getElementById("history");
    const row = `<tr>
      <td>${transactionCounter++}</td>
      <td>${selectedDiamonds}</td>
      <td>₱${selectedAmount}</td>
      <td>${method}</td>
      <td>Success</td>
      <td>${new Date().toLocaleString()}</td>
    </tr>`;
    historyTable.innerHTML += row;

    // Optional: send to backend
    await fetch("http://mlbbtopupproject.railway.internal", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": localStorage.getItem("token") },
      body: JSON.stringify({ diamonds: selectedDiamonds, amount: selectedAmount, method, mlbbId, mlbbServer })
    });
  }
</script>
<!-- Transaction Success Modal -->
<div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">Transaction Successful</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="receiptContent">
        <!-- Receipt details will be injected here -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-primary" id="downloadBtn">Download Receipt</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script> 


</script>

</script>
</body>
</html>
