<!DOCTYPE html>
<html>
<head>
 <title>MLBB Top-Up</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 <style>
 .package-card {
 cursor: pointer;
 transition: 0.3s;
 }
 .package-card.selected {
 border: 2px solid #ffc107;
 background-color: #fff3cd;
 }
 </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
 <div class="container-fluid">
 <a class="navbar-brand" href="#">MLBB Top-Up</a>
 <div id="userInfo" class="text-white"></div>
 </div>
</nav>

<div class="container mt-4">
 <!-- Login Section -->
 <div id="loginSection" class="card p-4 mb-4">
 <h4>Login</h4>
 <input id="email" class="form-control mb-2" type="email" placeholder="Email">
 <input id="password" class="form-control mb-2" type="password" placeholder="Password">
 <button class="btn btn-primary w-100" onclick="login()">Login</button>
 <p id="loginMsg" class="mt-3 text-center"></p>
 </div>

 <!-- Main App (hidden until logged in) -->
 <div id="appSection" style="display:none;">
 <!-- Step 1: MLBB ID -->
 <div class="card p-4 mb-4">
 <h4>Enter MLBB Account</h4>
 <input id="mlbbId" class="form-control mb-2" placeholder="Game ID">
 <input id="mlbbServer" class="form-control mb-2" placeholder="Server ID">
 </div>

 <!-- Step 2: Diamond Packages -->
 <div class="card p-4 mb-4">
 <h4>Select Diamonds</h4>
 <div class="row">
 <div class="col-md-3 mb-3">
 <div class="card text-center p-3 package-card" onclick="selectPackage(this,50,50)">
 <h5>50 Diamonds</h5>
 <p>₱50</p>
 </div>
 </div>
 <div class="col-md-3 mb-3">
 <div class="card text-center p-3 package-card" onclick="selectPackage(this,100,100)">
 <h5>100 Diamonds</h5>
 <p>₱100</p>
 </div>
 </div>
 <div class="col-md-3 mb-3">
 <div class="card text-center p-3 package-card" onclick="selectPackage(this,250,250)">
 <h5>250 Diamonds</h5>
 <p>₱250</p>
 </div>
 </div>
 <div class="col-md-3 mb-3">
 <div class="card text-center p-3 package-card" onclick="selectPackage(this,500,500)">
 <h5>500 Diamonds</h5>
 <p>₱500</p>
 </div>
 </div>
 </div>
 </div>

 <!-- Step 3: Payment -->
 <div class="card p-4 mb-4">
 <h4>Select Payment Method</h4>
 <select id="paymentMethod" class="form-select">
 <option value="GCash">GCash</option>
 <option value="PayMaya">PayMaya</option>
 <option value="PayPal">PayPal</option>
 </select>
 </div>

 <!-- Step 4: Pay Now -->
 <div class="card p-4 mb-4">
 <h4>Checkout</h4>
 <button class="btn btn-success w-100" onclick="checkout()">Pay Now</button>
 <p id="statusMsg" class="mt-3 text-center fw-bold"></p>
 </div>

 <!-- Step 5: Transaction History -->
 <div class="card p-4 mb-4">
 <h4>Transaction History</h4>
 <button class="btn btn-info mb-3" onclick="loadHistory()">Refresh History</button>
 <table class="table table-striped">
 <thead>
 <tr><th>ID</th><th>Diamonds</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr>
 </thead>
 <tbody id="history"></tbody>
 </table>
 </div>

 <button class="btn btn-danger w-100" onclick="logout()">Logout</button>
 </div>
</div>

<script>
 const API_URL = 'https://topupwebproject-production.up.railway.app';
 let selectedDiamonds = 0;
 let selectedAmount = 0;

 // Check if already logged in
 window.addEventListener('load', () => {
 const token = localStorage.getItem('token');
 if (token) {
 showApp();
 loadHistory();
 }
 });

 // LOGIN
 async function login() {
 const email = document.getElementById('email').value;
 const password = document.getElementById('password').value;

 if (!email || !password) {
 document.getElementById('loginMsg').innerText = '❌ Please enter email and password';
 return;
 }

 try {
 const response = await fetch(`${API_URL}/login`, {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ email, password })
 });

 const data = await response.json();

 if (response.ok && data.token) {
 localStorage.setItem('token', data.token);
 document.getElementById('loginMsg').innerText = '✅ Login successful!';
 setTimeout(() => showApp(), 1000);
 } else {
 document.getElementById('loginMsg').innerText = '❌ Invalid credentials';
 }
 } catch (error) {
 document.getElementById('loginMsg').innerText = '❌ Connection error: ' + error.message;
 }
 }

 // LOGOUT
 function logout() {
 localStorage.removeItem('token');
 document.getElementById('loginSection').style.display = 'block';
 document.getElementById('appSection').style.display = 'none';
 document.getElementById('email').value = '';
 document.getElementById('password').value = '';
 document.getElementById('loginMsg').innerText = '';
 }

 // Show app after login
 function showApp() {
 document.getElementById('loginSection').style.display = 'none';
 document.getElementById('appSection').style.display = 'block';
 document.getElementById('userInfo').innerText = '✅ Logged In';
 }

 // SELECT PACKAGE
 function selectPackage(element, diamonds, amount) {
 document.querySelectorAll('.package-card').forEach(card => card.classList.remove('selected'));
 element.classList.add('selected');
 selectedDiamonds = diamonds;
 selectedAmount = amount;
 }

 // CHECKOUT
 async function checkout() {
 if (!selectedDiamonds) {
 alert('Please select a diamond package!');
 return;
 }

 const mlbbId = document.getElementById('mlbbId').value;
 const mlbbServer = document.getElementById('mlbbServer').value;
 const method = document.getElementById('paymentMethod').value;
 const token = localStorage.getItem('token');

 if (!mlbbId || !mlbbServer) {
 alert('Please enter MLBB ID and Server ID');
 return;
 }

 try {
 const response = await fetch(`${API_URL}/topup`, {
 method: 'POST',
 headers: {
 'Content-Type': 'application/json',
 'Authorization': token
 },
 body: JSON.stringify({
 diamonds: selectedDiamonds,
 amount: selectedAmount,
 method,
 mlbbId,
 mlbbServer
 })
 });

 const data = await response.json();

 if (response.ok) {
 document.getElementById('statusMsg').innerText = 
 `✅ Payment Successful! ${selectedDiamonds} Diamonds purchased for ₱${selectedAmount} via ${method}.`;
 
 // Clear form
 document.getElementById('mlbbId').value = '';
 document.getElementById('mlbbServer').value = '';
 document.querySelectorAll('.package-card').forEach(card => card.classList.remove('selected'));
 selectedDiamonds = 0;
 selectedAmount = 0;

 // Reload history
 setTimeout(() => loadHistory(), 1000);
 } else {
 document.getElementById('statusMsg').innerText = '❌ Payment failed: ' + (data.message || 'Unknown error');
 }
 } catch (error) {
 document.getElementById('statusMsg').innerText = '❌ Error: ' + error.message;
 }
 }

 // LOAD HISTORY
 async function loadHistory() {
 const token = localStorage.getItem('token');

 try {
 const response = await fetch(`${API_URL}/history`, {
 method: 'GET',
 headers: { 'Authorization': token }
 });

 const data = await response.json();

 if (response.ok && Array.isArray(data)) {
 const historyTable = document.getElementById('history');
 historyTable.innerHTML = '';

 data.forEach((transaction, index) => {
 const row = `<tr>
 <td>${transaction.id}</td>
 <td>${transaction.diamonds}</td>
 <td>₱${transaction.amount}</td>
 <td>${transaction.method}</td>
 <td>${transaction.status}</td>
 <td>${new Date(transaction.date).toLocaleString()}</td>
 </tr>`;
 historyTable.innerHTML += row;
 });
 } else {
 document.getElementById('history').innerHTML = '<tr><td colspan="6" class="text-center">No transactions found</td></tr>';
 }
 } catch (error) {
 document.getElementById('history').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Error loading history</td></tr>';
 }
 }
</script>
</body>
</html>
